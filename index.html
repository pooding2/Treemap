<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌳 나무지도</title>
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a81a107ce3acfc631a495b7473008f75&autoload=false"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBKMV3e2wug7q8XWpPiBLCyKfKKlX-",
    authDomain: "treemap-a451b.firebaseapp.com",
    projectId: "treemap-a451b",
    storageBucket: "treemap-a451b.firebasestorage.app",
    messagingSenderId: "439504864862",
    appId: "1:439504864862:web:ae1379f4c22c147c6b56cf"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._fbFuncs = { collection, addDoc, updateDoc, doc, onSnapshot, orderBy, query };
  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;600&display=swap');
:root {
  --forest: #0f1f0f; --moss: #1e3a1e; --leaf: #3d6e4a;
  --sage: #6fa87a; --mist: #c2d9c8; --cream: #f4efe6;
  --gold: #c9a84c; --shadow: rgba(5,15,5,0.6);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--forest); color: var(--cream); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: linear-gradient(135deg, #0a150a, #1a301a); border-bottom: 1px solid rgba(61,110,74,0.5); flex-shrink: 0; }
.logo { font-family: 'Nanum Myeongjo', serif; font-size: 20px; font-weight: 800; color: var(--mist); }
.logo span { color: var(--gold); }
.header-stats { display: flex; gap: 16px; }
.stat { text-align: center; }
.stat-n { font-size: 17px; font-weight: 700; color: var(--gold); display: block; line-height: 1; }
.stat-l { font-size: 10px; color: var(--sage); }
#map { flex: 1; width: 100%; }
.fab-wrap { position: fixed; bottom: 24px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 200; }
.fab { width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px var(--shadow); transition: transform 0.2s; }
.fab:hover { transform: scale(1.1); }
.fab-main { background: linear-gradient(135deg, var(--leaf), #2a5a35); color: white; width: 58px; height: 58px; font-size: 26px; border: 2px solid var(--sage); }
.fab-main.active { background: linear-gradient(135deg, #8b2020, #5a1515); border-color: #e07070; }
.fab-hint { background: rgba(15,31,15,0.92); border: 1px solid var(--leaf); border-radius: 20px; padding: 7px 14px; font-size: 12px; color: var(--sage); white-space: nowrap; backdrop-filter: blur(8px); }
.fab-hint.active { background: rgba(80,20,20,0.92); border-color: #e07070; color: #f09090; }
.overlay { position: fixed; inset: 0; background: rgba(5,15,5,0.85); backdrop-filter: blur(6px); z-index: 300; display: flex; align-items: flex-end; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
.modal { background: linear-gradient(160deg, #1e3a1e, #0f1f0f); border: 1px solid rgba(61,110,74,0.6); border-radius: 22px 22px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 -10px 50px rgba(0,0,0,0.7); animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1); }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
.modal-drag { width: 38px; height: 4px; background: var(--leaf); border-radius: 2px; margin: 14px auto 0; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid rgba(61,110,74,0.25); }
.modal-title { font-family: 'Nanum Myeongjo', serif; font-size: 19px; font-weight: 700; color: var(--mist); }
.close-btn { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: var(--sage); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.close-btn:hover { background: rgba(255,255,255,0.15); }
.modal-body { padding: 16px 20px 32px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--sage); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; }
.form-input, .form-select, .form-textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(111,168,122,0.3); border-radius: 10px; padding: 10px 13px; color: var(--cream); font-family: 'Noto Sans KR', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--sage); background: rgba(255,255,255,0.09); }
.form-select option { background: #1e3a1e; }
.form-textarea { resize: vertical; min-height: 76px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.photo-upload { border: 2px dashed rgba(111,168,122,0.35); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.photo-upload:hover { border-color: var(--sage); background: rgba(111,168,122,0.05); }
.photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-preview { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; display: block; }
.upload-icon { font-size: 28px; margin-bottom: 6px; }
.upload-text { font-size: 12px; color: var(--sage); }
.btn { padding: 12px 20px; border-radius: 12px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; }
.btn-primary { background: linear-gradient(135deg, var(--leaf), #2a5a35); color: white; width: 100%; padding: 14px; box-shadow: 0 4px 16px rgba(61,110,74,0.4); }
.btn-primary:hover { transform: translateY(-1px); }
.btn-secondary { background: rgba(255,255,255,0.08); color: var(--sage); border: 1px solid rgba(111,168,122,0.3); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn-primary { flex: 1; }
.tree-profile { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.tree-thumb { width: 80px; height: 80px; border-radius: 14px; border: 2px solid var(--leaf); flex-shrink: 0; background: var(--moss); display: flex; align-items: center; justify-content: center; font-size: 32px; overflow: hidden; }
.tree-thumb img { width: 100%; height: 100%; object-fit: cover; }
.tree-info h2 { font-family: 'Nanum Myeongjo', serif; font-size: 20px; color: var(--mist); margin-bottom: 4px; }
.tree-meta { font-size: 12px; color: var(--sage); margin-bottom: 8px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: rgba(61,110,74,0.25); border: 1px solid rgba(61,110,74,0.4); color: var(--mist); }
.growth-bar-wrap { margin-bottom: 16px; }
.growth-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--sage); margin-bottom: 5px; }
.growth-bar-track { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.growth-bar-fill { height: 100%; background: linear-gradient(90deg, var(--leaf), var(--gold)); border-radius: 3px; transition: width 0.8s ease; }
.section-title { font-size: 12px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content:''; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background: linear-gradient(to bottom, var(--leaf), transparent); }
.tl-item { position: relative; margin-bottom: 14px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 11px 13px; border: 1px solid rgba(111,168,122,0.12); }
.tl-item::before { content:''; position:absolute; left:-17px; top:13px; width:9px; height:9px; border-radius:50%; background:var(--leaf); border:2px solid var(--forest); }
.tl-date { font-size: 10px; color: var(--gold); margin-bottom: 3px; }
.tl-height { font-size: 19px; font-weight: 700; color: var(--mist); font-family: 'Nanum Myeongjo', serif; }
.tl-note { font-size: 12px; color: var(--sage); margin-top: 3px; }
.tl-photo { width:100%; max-height:110px; object-fit:cover; border-radius:8px; margin-top:8px; }
.add-update-btn { display: flex; align-items: center; gap: 8px; background: rgba(61,110,74,0.12); border: 1px dashed rgba(111,168,122,0.35); border-radius: 12px; padding: 12px 16px; color: var(--sage); cursor: pointer; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; width: 100%; transition: background 0.2s; margin-top: 8px; }
.add-update-btn:hover { background: rgba(61,110,74,0.22); }
.update-form { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 15px; border: 1px solid rgba(111,168,122,0.18); margin-top: 8px; }
.toast { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); background: var(--leaf); color: white; padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.4); white-space: nowrap; animation: toastIn 0.3s ease; pointer-events: none; }
@keyframes toastIn { from { transform:translateX(-50%) translateY(-12px); opacity:0 } to { transform:translateX(-50%) translateY(0); opacity:1 } }
.loading { position: fixed; inset: 0; background: var(--forest); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
.loading-tree { font-size: 60px; animation: sway 2s ease-in-out infinite; }
@keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
.loading-text { font-family:'Nanum Myeongjo',serif; font-size:18px; color:var(--mist); }
.loading-sub { font-size:13px; color:var(--sage); }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--leaf); border-radius: 2px; }
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="loading-tree">🌳</div>
  <div class="loading-text">나무지도</div>
  <div class="loading-sub">지도를 불러오는 중...</div>
</div>
<div class="header">
  <div class="logo">🌳 나무<span>지도</span></div>
  <div class="header-stats">
    <div class="stat"><span class="stat-n" id="stat-trees">0</span><span class="stat-l">나무</span></div>
    <div class="stat"><span class="stat-n" id="stat-species">0</span><span class="stat-l">수종</span></div>
    <div class="stat"><span class="stat-n" id="stat-records">0</span><span class="stat-l">기록</span></div>
  </div>
</div>
<div id="map"></div>
<div class="fab-wrap">
  <div class="fab-hint" id="fab-hint">🌱 버튼을 눌러 나무 추가</div>
  <button class="fab fab-main" id="fab-btn" onclick="toggleAddMode()">🌱</button>
</div>
<div class="overlay" id="add-modal" style="display:none" onclick="closeAddModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-drag"></div>
    <div class="modal-header">
      <div class="modal-title">🌱 새 나무 등록</div>
      <button class="close-btn" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">나무 이름 *</label>
        <input class="form-input" id="input-name" placeholder="예: 우리 마당 소나무">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">수종 *</label>
          <select class="form-select" id="input-species">
            <option>소나무</option><option>잣나무</option><option>편백나무</option>
            <option>참나무</option><option>상수리나무</option><option>벚나무</option>
            <option>단풍나무</option><option>은행나무</option><option>느티나무</option>
            <option>메타세쿼이아</option><option>히말라야시다</option><option>자작나무</option>
            <option>오동나무</option><option>팽나무</option><option>이팝나무</option>
            <option>산벚나무</option><option>플라타너스</option><option>회화나무</option>
            <option>기타</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">심은 날짜</label>
          <input class="form-input" id="input-date" type="date">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">메모</label>
        <textarea class="form-textarea" id="input-note" placeholder="이 나무를 심은 이유나 특별한 기억을 적어주세요"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">사진</label>
        <div class="photo-upload">
          <input type="file" accept="image/*" id="add-photo-input" onchange="previewPhoto(this,'add-photo-preview','add-photo-placeholder')">
          <img id="add-photo-preview" class="photo-preview" style="display:none">
          <div id="add-photo-placeholder"><div class="upload-icon">📷</div><div class="upload-text">사진을 업로드하세요</div></div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="submitTree()">🌳 이 위치에 나무 심기</button>
    </div>
  </div>
</div>
<div class="overlay" id="detail-modal" style="display:none" onclick="closeDetailModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-drag"></div>
    <div class="modal-header">
      <div class="modal-title">🌲 나무 정보</div>
      <button class="close-btn" onclick="closeDetailModal()">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>
<script>
let map, addMode=false, pendingLatLng=null, trees=[], currentTreeId=null, markers={};
const EMOJI={"소나무":"🌲","잣나무":"🌲","편백나무":"🌲","벚나무":"🌸","단풍나무":"🍁","은행나무":"🍂","느티나무":"🌳","메타세쿼이아":"🌲","자작나무":"🌿","기타":"🌱"};
function waitForFirebase(cb){if(window._firebaseReady)cb();else window.addEventListener('firebaseReady',cb);}
waitForFirebase(()=>{
  document.getElementById('input-date').value=new Date().toISOString().split('T')[0];
  kakao.maps.load(()=>{
    map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(36.5,127.8),level:8});
    kakao.maps.event.addListener(map,'click',(e)=>{
      if(!addMode)return;
      pendingLatLng=e.latLng;
      toggleAddMode(false);
      document.getElementById('add-modal').style.display='flex';
    });
    listenTrees();
    document.getElementById('loading').style.display='none';
  });
});
function listenTrees(){
  const{collection,onSnapshot,query,orderBy}=window._fbFuncs;
  const q=query(collection(window._db,'trees'),orderBy('createdAt','desc'));
  onSnapshot(q,(snap)=>{
    trees=[];
    snap.forEach(d=>trees.push({id:d.id,...d.data()}));
    renderMarkers();
    updateStats();
  });
}
function renderMarkers(){
  Object.values(markers).forEach(m=>m.setMap(null));
  markers={};
  trees.forEach(tree=>{
    const emoji=EMOJI[tree.species]||'🌱';
    const div=document.createElement('div');
    div.innerHTML=emoji;
    div.style.cssText='background:linear-gradient(135deg,#1e3a1e,#0f1f0f);border:2px solid #3d6e4a;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 12px rgba(0,0,0,0.5);cursor:pointer;';
    div.addEventListener('click',()=>openDetailModal(tree.id));
    const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(tree.lat,tree.lng),content:div,yAnchor:1});
    ov.setMap(map);
    markers[tree.id]=ov;
  });
}
function updateStats(){
  document.getElementById('stat-trees').textContent=trees.length;
  document.getElementById('stat-species').textContent=new Set(trees.map(t=>t.species)).size;
  document.getElementById('stat-records').textContent=trees.reduce((s,t)=>s+(t.updates?t.updates.length:1),0);
}
function toggleAddMode(force){
  addMode=force!==undefined?force:!addMode;
  const btn=document.getElementById('fab-btn'),hint=document.getElementById('fab-hint');
  if(addMode){btn.textContent='✕';btn.classList.add('active');hint.textContent='🎯 지도에서 위치를 클릭하세요';hint.classList.add('active');document.getElementById('map').style.cursor='crosshair';}
  else{btn.textContent='🌱';btn.classList.remove('active');hint.textContent='🌱 버튼을 눌러 나무 추가';hint.classList.remove('active');document.getElementById('map').style.cursor='';}
}
function closeAddModal(){
  document.getElementById('add-modal').style.display='none';
  pendingLatLng=null;
  document.getElementById('input-name').value='';
  document.getElementById('input-note').value='';
  document.getElementById('add-photo-preview').style.display='none';
  document.getElementById('add-photo-placeholder').style.display='block';
}
async function submitTree(){
  const name=document.getElementById('input-name').value.trim();
  const species=document.getElementById('input-species').value;
  const date=document.getElementById('input-date').value;
  const note=document.getElementById('input-note').value.trim();
  const prev=document.getElementById('add-photo-preview');
  const photo=prev.style.display!=='none'?prev.src:null;
  if(!name){showToast('⚠️ 나무 이름을 입력해주세요');return;}
  if(!pendingLatLng){showToast('⚠️ 지도에서 위치를 먼저 선택해주세요');return;}
  try{
    await window._fbFuncs.addDoc(window._fbFuncs.collection(window._db,'trees'),{
      name,species,plantedDate:date,note,photo,
      lat:pendingLatLng.getLat(),lng:pendingLatLng.getLng(),
      createdAt:new Date().toISOString(),
      updates:[{date,height:0,note:note||'심은 날!',photo}]
    });
    closeAddModal();
    showToast('🌱 나무가 등록되었습니다!');
  }catch(e){console.error(e);showToast('❌ 저장 중 오류가 발생했어요');}
}
function openDetailModal(id){
  currentTreeId=id;
  renderDetail(id);
  document.getElementById('detail-modal').style.display='flex';
}
function closeDetailModal(){document.getElementById('detail-modal').style.display='none';currentTreeId=null;}
function renderDetail(id){
  const tree=trees.find(t=>t.id===id);if(!tree)return;
  const updates=tree.updates||[];
  const latest=updates[updates.length-1];
  const h=latest?latest.height:0;
  const pct=Math.min((h/10)*100,100);
  const emoji=EMOJI[tree.species]||'🌱';
  const tl=[...updates].reverse().map(u=>`
    <div class="tl-item">
      <div class="tl-date">${fmtDate(u.date)}</div>
      ${u.height>0?`<div class="tl-height">${u.height}m</div>`:''}
      ${u.note?`<div class="tl-note">${u.note}</div>`:''}
      ${u.photo?`<img src="${u.photo}" class="tl-photo">`:''}
    </div>`).join('');
  document.getElementById('detail-body').innerHTML=`
    <div class="tree-profile">
      <div class="tree-thumb">${tree.photo?`<img src="${tree.photo}" alt="">`:`${emoji}`}</div>
      <div class="tree-info">
        <h2>${tree.name}</h2>
        <div class="tree-meta">심은 날: ${fmtDate(tree.plantedDate)}</div>
        <div class="tags">
          <span class="tag">${tree.species}</span>
          ${h>0?`<span class="tag">현재 ${h}m</span>`:''}
          <span class="tag">기록 ${updates.length}회</span>
        </div>
      </div>
    </div>
    ${h>0?`<div class="growth-bar-wrap"><div class="growth-bar-label"><span>성장 현황</span><span>${h}m / 목표 10m</span></div><div class="growth-bar-track"><div class="growth-bar-fill" style="width:${pct}%"></div></div></div>`:''}
    ${tree.note?`<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 13px;font-size:13px;color:#b8d4be;margin-bottom:16px;font-style:italic;">"${tree.note}"</div>`:''}
    <div class="section-title">📅 성장 기록</div>
    <div class="timeline">${tl}</div>
    <div id="update-form-wrap">
      <button class="add-update-btn" onclick="showUpdateForm()">＋ 성장 기록 추가하기</button>
    </div>`;
}
function showUpdateForm(){
  document.getElementById('update-form-wrap').innerHTML=`
    <div class="update-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">현재 키 (m)</label>
          <input class="form-input" id="upd-height" type="number" step="0.1" min="0" placeholder="예: 1.5">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">한 마디</label>
        <input class="form-input" id="upd-note" placeholder="오늘 나무 상태는?">
      </div>
      <div class="form-group">
        <label class="form-label">사진</label>
        <div class="photo-upload">
          <input type="file" accept="image/*" onchange="previewPhoto(this,'upd-photo-preview','upd-photo-placeholder')" id="upd-photo-input">
          <img id="upd-photo-preview" class="photo-preview" style="display:none">
          <div id="upd-photo-placeholder"><div class="upload-icon">📷</div><div class="upload-text">사진 추가</div></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="submitUpdate()">저장</button>
        <button class="btn btn-secondary" onclick="renderDetail(currentTreeId)">취소</button>
      </div>
    </div>`;}
async function submitUpdate(){
  const h=parseFloat(document.getElementById('upd-height').value);
  const note=document.getElementById('upd-note').value.trim();
  const prev=document.getElementById('upd-photo-preview');
  const photo=prev&&prev.style.display!=='none'?prev.src:null;
  if(!h&&h!==0){showToast('⚠️ 키를 입력해주세요');return;}
  const tree=trees.find(t=>t.id===currentTreeId);if(!tree)return;
  const newU={date:new Date().toISOString().split('T')[0],height:h,note,photo};
  try{
    await window._fbFuncs.updateDoc(window._fbFuncs.doc(window._db,'trees',currentTreeId),{updates:[...(tree.updates||[]),newU]});
    showToast('📏 성장 기록이 추가되었습니다!');
    tree.updates=[...(tree.updates||[]),newU];
    renderDetail(currentTreeId);
  }catch(e){console.error(e);showToast('❌ 저장 중 오류가 발생했어요');}
}
function previewPhoto(input,prevId,phId){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const prev=document.getElementById(prevId);
    if(prev){prev.src=e.target.result;prev.style.display='block';}
    const ph=document.getElementById(phId);
    if(ph)ph.style.display='none';
  };
  reader.readAsDataURL(file);
}
function fmtDate(d){if(!d)return'';const dt=new Date(d);return`${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일`;}
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  let el=document.getElementById('toast-el');
  if(!el){el=document.createElement('div');el.id='toast-el';el.className='toast';document.body.appendChild(el);}
  el.textContent=msg;el.style.display='block';el.style.animation='none';void el.offsetWidth;el.style.animation='toastIn 0.3s ease';
  toastTimer=setTimeout(()=>{if(el)el.style.display='none';},2500);
}
</script>
